[package]
name = "keccak-pow"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "keccak-pow"
path = "src/main.rs"

[dependencies]
leanvm_core = { path = "../vendor/leanVM/crates/leanvm_core" }
lean_compiler = { path = "../vendor/leanVM/crates/lean_compiler" }
primitives = { path = "../vendor/leanVM/crates/primitives" }
bench = { path = "../vendor/leanVM/crates/bench" }
bincode = "1"
clap = { version = "4", features = ["derive"] }
sha3 = "0.11"
tracing = "0.1.26"
