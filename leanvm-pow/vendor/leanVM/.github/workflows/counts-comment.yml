name: Counts comment

# Posts on a PR the exact counts its Counts run (counts.yml) found changed against its base:
# one comment, edited on every run and deleted once nothing differs. A run that failed on an
# increase saved its counts first, so it is posted too.
#
# It runs from the default branch (GitHub runs a `workflow_run` workflow from nowhere else)
# with a write token, on an artifact a PR's run wrote, a fork's included:
# .github/scripts/pr_comment.py says what it trusts of it. It checks out the default branch's
# own script, never the PR's code.

on:
  workflow_run:
    workflows: [ Counts ]
    types: [ completed ]

permissions: {}

jobs:
  comment:
    name: Comment
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Find the counts
        id: results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          count=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "counts")] | length')
          echo "found=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.results.outputs.found == 'true'
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: steps.results.outputs.found == 'true'
        with:
          name: counts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: counts
      - name: Comment
        if: steps.results.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 .github/scripts/pr_comment.py counts "$HEAD_SHA" counts/counts.json
