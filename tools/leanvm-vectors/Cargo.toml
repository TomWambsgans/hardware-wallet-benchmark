# Generates test vectors for the device port from leanVM's reference
# implementation (crates/sphincs), expected at ../../../../leanVM (i.e. leanVM
# checked out next to the `zk` directory holding this repo).
#
#   cargo run --release > ../../vectors/leanvm-sphincs-blake2s.json
[package]
name = "leanvm-vectors"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
sphincs = { path = "../../../../leanVM/crates/sphincs" }
